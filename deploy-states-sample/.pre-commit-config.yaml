repos:
  - repo: local
    hooks:
      - id: normalize-additional-plugs
        name: Normalize ADDITIONAL_PLUGS
        description: Canonicalize env/*/build/care/care.env to the heredoc format
        entry: python3 tools/normalize_plugs.py
        language: system
        pass_filenames: false
        files: ^env/.*/build/care/care\.env$
