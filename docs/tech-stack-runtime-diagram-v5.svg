<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .tt{font:700 26px 'Inter','Segoe UI',Arial,sans-serif;fill:#1F6F6B}
      .tb{font:700 26px 'Inter','Segoe UI',Arial,sans-serif;fill:#1E6FD0}
      .tk{font:700 26px 'Inter','Segoe UI',Arial,sans-serif;fill:#111827}
      .s{font:600 17px 'Inter','Segoe UI',Arial,sans-serif;fill:#222}
      .l{font:600 17px 'Inter','Segoe UI',Arial,sans-serif;fill:#111827;paint-order:stroke;stroke:#fff;stroke-width:8px;stroke-linejoin:round}
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2640"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- ============ ARROWS (behind cards) ============ -->
  <g fill="none" stroke="#1B2640" stroke-width="2.5" stroke-linejoin="round">
    <line x1="190" y1="330" x2="300" y2="330" marker-end="url(#m)"/>                                   <!-- Users -> FE -->
    <line x1="520" y1="330" x2="620" y2="330" marker-end="url(#m)"/>                                   <!-- FE -> BE -->
    <line x1="860" y1="260" x2="1060" y2="260" marker-start="url(#m)" marker-end="url(#m)"/>           <!-- BE <-> PG -->
    <line x1="860" y1="430" x2="1060" y2="430" marker-start="url(#m)" marker-end="url(#m)"/>           <!-- BE <-> Storage -->
    <line x1="740" y1="470" x2="740" y2="580" marker-start="url(#m)" marker-end="url(#m)"/>            <!-- BE <-> Redis -->
    <polyline points="470,850 680,850 680,730" marker-end="url(#m)"/>                                  <!-- Beat -> Redis -->
    <polyline points="800,730 800,850 960,850" marker-start="url(#m)" marker-end="url(#m)"/>           <!-- Redis <-> Worker -->
    <line x1="1120" y1="760" x2="1120" y2="570" marker-start="url(#m)" marker-end="url(#m)"/>          <!-- Worker <-> Storage -->
    <polyline points="1180,850 1440,850 1440,180 1320,180" marker-start="url(#m)" marker-end="url(#m)"/> <!-- Worker <-> PG -->
  </g>

  <!-- ============ ARROW LABELS ============ -->
  <text x="245" y="316" text-anchor="middle" class="l">opens app</text>
  <text x="570" y="316" text-anchor="middle" class="l">API calls</text>
  <text x="960" y="246" text-anchor="middle" class="l">data read/write</text>
  <text x="960" y="416" text-anchor="middle" class="l">file upload/download</text>
  <text x="728" y="530" text-anchor="end" class="l">cache + enqueue</text>
  <text x="570" y="836" text-anchor="middle" class="l">scheduled tasks</text>
  <text x="880" y="836" text-anchor="middle" class="l">consume tasks</text>
  <text x="1134" y="670" class="l">files</text>
  <text x="1454" y="520" class="l">data</text>
  <text x="1454" y="542" class="l">read/write</text>

  <!-- ============ CARDS ============ -->
  <g filter="url(#sh)" fill="#fff" stroke-width="2.5">
    <rect x="20"   y="220" width="170" height="220" rx="14" stroke="#1F6F6B"/>
    <rect x="300"  y="220" width="220" height="220" rx="14" stroke="#1F6F6B"/>
    <rect x="620"  y="220" width="240" height="250" rx="14" stroke="#1F6F6B"/>
    <rect x="1060" y="80"  width="260" height="210" rx="14" stroke="#2F7FD8"/>
    <rect x="1060" y="360" width="260" height="210" rx="14" stroke="#2F7FD8"/>
    <rect x="620"  y="580" width="240" height="150" rx="14" stroke="#1F6F6B"/>
    <rect x="250"  y="760" width="220" height="190" rx="14" stroke="#1F6F6B"/>
    <rect x="960"  y="760" width="220" height="190" rx="14" stroke="#1F6F6B"/>
  </g>

  <!-- Users / Browser : people icon -->
  <g fill="#1F6F6B">
    <circle cx="80" cy="270" r="12"/><path d="M60,310 a20,20 0 0 1 40,0 z"/>
    <circle cx="130" cy="270" r="12"/><path d="M110,310 a20,20 0 0 1 40,0 z"/>
    <circle cx="105" cy="262" r="15"/><path d="M79,316 a26,26 0 0 1 52,0 z"/>
  </g>
  <text x="105" y="365" text-anchor="middle" class="tt">Users /</text>
  <text x="105" y="397" text-anchor="middle" class="tt">Browser</text>

  <!-- Frontend : React atom -->
  <text x="410" y="262" text-anchor="middle" class="tt">Frontend</text>
  <g fill="none" stroke="#61DAFB" stroke-width="4" transform="translate(410,320)">
    <ellipse rx="48" ry="18"/>
    <ellipse rx="48" ry="18" transform="rotate(60)"/>
    <ellipse rx="48" ry="18" transform="rotate(120)"/>
  </g>
  <circle cx="410" cy="320" r="8" fill="#61DAFB"/>
  <text x="410" y="395" text-anchor="middle" class="s">React Static App</text>
  <text x="410" y="418" text-anchor="middle" class="s">(served by Nginx)</text>

  <!-- Backend : django wordmark -->
  <text x="740" y="265" text-anchor="middle" class="tt">Backend</text>
  <text x="740" y="365" text-anchor="middle" style="font:800 58px 'Inter','Segoe UI',Arial,sans-serif;fill:#0C4B33;letter-spacing:-1px">django</text>
  <text x="740" y="430" text-anchor="middle" class="s">Django API</text>

  <!-- PostgreSQL : database cylinder -->
  <g fill="#fff" stroke="#336791" stroke-width="4">
    <path d="M1160,110 v60 a30,11 0 0 0 60,0 v-60"/>
    <ellipse cx="1190" cy="110" rx="30" ry="11"/>
    <path d="M1160,130 a30,11 0 0 0 60,0 M1160,150 a30,11 0 0 0 60,0" fill="none"/>
  </g>
  <text x="1190" y="230" text-anchor="middle" class="tb">PostgreSQL</text>
  <text x="1190" y="258" text-anchor="middle" class="s">Primary Database</text>

  <!-- Object Storage : bucket -->
  <g>
    <path d="M1160,392 L1220,392 L1212,458 Q1190,468 1168,458 Z" fill="#7AA116" stroke="#4d6b0c" stroke-width="3"/>
    <ellipse cx="1190" cy="392" rx="30" ry="9" fill="#9cc43a" stroke="#4d6b0c" stroke-width="3"/>
  </g>
  <text x="1190" y="500" text-anchor="middle" class="tb">Object Storage</text>
  <text x="1190" y="526" text-anchor="middle" class="s">S3-compatible /</text>
  <text x="1190" y="548" text-anchor="middle" class="s">Cloud Object Storage</text>

  <!-- Redis : stacked cubes -->
  <g stroke="#fff" stroke-width="1.5">
    <path d="M740,600 l30,10 l-30,10 l-30,-10 z" fill="#D82C20"/>
    <path d="M710,610 v8 l30,10 v-8 z" fill="#A41E11"/><path d="M770,610 v8 l-30,10 v-8 z" fill="#C6302B"/>
    <path d="M740,618 l30,10 l-30,10 l-30,-10 z" fill="#D82C20"/>
    <path d="M710,628 v8 l30,10 v-8 z" fill="#A41E11"/><path d="M770,628 v8 l-30,10 v-8 z" fill="#C6302B"/>
  </g>
  <text x="740" y="684" text-anchor="middle" class="tt">Redis</text>
  <text x="740" y="710" text-anchor="middle" class="s">Cache + Task Broker</text>

  <!-- Celery Beat : clock -->
  <g fill="none" stroke="#1F6F6B" stroke-width="4" stroke-linecap="round">
    <circle cx="360" cy="815" r="26"/>
    <path d="M360,800 v16 l12,8"/>
  </g>
  <text x="360" y="880" text-anchor="middle" class="tt">Celery Beat</text>
  <text x="360" y="906" text-anchor="middle" class="s">Scheduler</text>
  <text x="360" y="928" text-anchor="middle" class="s">(single active)</text>

  <!-- Celery Worker : gear -->
  <g transform="translate(1070,815)" fill="#1F6F6B">
    <g id="teeth">
      <rect x="-6" y="-32" width="12" height="14" rx="2"/>
      <rect x="-6" y="-32" width="12" height="14" rx="2" transform="rotate(45)"/>
      <rect x="-6" y="-32" width="12" height="14" rx="2" transform="rotate(90)"/>
      <rect x="-6" y="-32" width="12" height="14" rx="2" transform="rotate(135)"/>
      <rect x="-6" y="-32" width="12" height="14" rx="2" transform="rotate(180)"/>
      <rect x="-6" y="-32" width="12" height="14" rx="2" transform="rotate(225)"/>
      <rect x="-6" y="-32" width="12" height="14" rx="2" transform="rotate(270)"/>
      <rect x="-6" y="-32" width="12" height="14" rx="2" transform="rotate(315)"/>
    </g>
    <circle r="22"/>
    <circle r="9" fill="#fff"/>
  </g>
  <text x="1070" y="880" text-anchor="middle" class="tt">Celery Worker</text>
  <text x="1070" y="906" text-anchor="middle" class="s">Async Task</text>
  <text x="1070" y="928" text-anchor="middle" class="s">Executor</text>
</svg>
