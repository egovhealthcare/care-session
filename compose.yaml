name: care-local

x-care-backend: &care-backend
  image: care-local-backend
  build:
    context: ./care
    dockerfile: docker/prod.Dockerfile
    args:
      ADDITIONAL_PLUGS: ${ADDITIONAL_PLUGS:-[]}
  env_file:
    - path: .env.example          # committed workshop defaults
    - path: .env                  # optional local overrides, never committed
      required: false

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: care
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d care"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  silo:
    image: docker.io/pgsty/silo:latest
    environment:
      MINIO_ROOT_USER: siloadmin
      MINIO_ROOT_PASSWORD: siloadmin
      AWS_DEFAULT_REGION: ap-south-1
    volumes:
      - silo-data:/data
      # Silo provides a MinIO-compatible API; reuse CARE's upstream bucket setup scripts.
      - ./care/docker/minio/init-script.sh:/init-script.sh:ro
      - ./care/docker/minio/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "9001:9001"
      - "9100:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *care-backend
    entrypoint: ["bash", "start.sh"]
    ports:
      - "9000:9000"
    depends_on:
      beat:
        condition: service_healthy
      silo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/ping/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    <<: *care-backend
    entrypoint: ["bash", "celery_worker.sh"]
    depends_on:
      beat:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *care-backend
    entrypoint: ["bash", "celery_beat.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    image: care-local-frontend
    build:
      context: ./care_fe
      additional_contexts:
        workshop: .
      # Same steps as care_fe/Dockerfile, plus the workshop's frontend build
      # settings, so no file has to be copied into the submodule.
      dockerfile_inline: |
        FROM --platform=$$BUILDPLATFORM node:22-bookworm-slim AS build-stage
        WORKDIR /app
        ENV NODE_OPTIONS="--max-old-space-size=4096"
        RUN apt-get update && apt-get install -y git
        COPY package.json package-lock.json ./
        RUN npm install --ignore-scripts
        COPY . .
        COPY --from=workshop frontend.env.production.local .env.production.local
        RUN npm run postinstall
        RUN npm run build

        FROM nginx:stable-alpine AS production-stage
        COPY --from=build-stage /app/build /usr/share/nginx/html
        COPY ./nginx/nginx.conf /etc/nginx/conf.d/default.conf
        EXPOSE 80
        CMD ["nginx", "-g", "daemon off;"]
    ports:
      - "4000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  silo-data:
